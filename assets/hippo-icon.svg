<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#4CAF50"/>

  <!-- Hippo body/head -->
  <ellipse cx="512" cy="520" rx="280" ry="260" fill="#8B7355"/>

  <!-- Hippo face/snout -->
  <ellipse cx="512" cy="620" rx="180" ry="140" fill="#A08060"/>

  <!-- Nostrils -->
  <ellipse cx="460" cy="640" rx="25" ry="20" fill="#6B5344"/>
  <ellipse cx="564" cy="640" rx="25" ry="20" fill="#6B5344"/>

  <!-- Eyes -->
  <ellipse cx="400" cy="450" rx="50" ry="55" fill="white"/>
  <ellipse cx="624" cy="450" rx="50" ry="55" fill="white"/>
  <ellipse cx="410" cy="460" rx="28" ry="32" fill="#2d3436"/>
  <ellipse cx="634" cy="460" rx="28" ry="32" fill="#2d3436"/>
  <!-- Eye shine -->
  <ellipse cx="420" cy="450" rx="10" ry="12" fill="white"/>
  <ellipse cx="644" cy="450" rx="10" ry="12" fill="white"/>

  <!-- Ears -->
  <ellipse cx="280" cy="340" rx="60" ry="50" fill="#8B7355"/>
  <ellipse cx="280" cy="340" rx="35" ry="30" fill="#C4A77D"/>
  <ellipse cx="744" cy="340" rx="60" ry="50" fill="#8B7355"/>
  <ellipse cx="744" cy="340" rx="35" ry="30" fill="#C4A77D"/>

  <!-- Mouth/smile -->
  <path d="M 420 720 Q 512 780 604 720" stroke="#6B5344" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="320" cy="560" rx="45" ry="30" fill="#E8B4B8" opacity="0.6"/>
  <ellipse cx="704" cy="560" rx="45" ry="30" fill="#E8B4B8" opacity="0.6"/>

  <!-- Chef hat -->
  <ellipse cx="512" cy="240" rx="140" ry="50" fill="white"/>
  <rect x="372" y="180" width="280" height="70" fill="white"/>
  <ellipse cx="512" cy="140" rx="100" ry="80" fill="white"/>
  <ellipse cx="512" cy="180" rx="120" ry="60" fill="white"/>

  <!-- Hat pleats -->
  <path d="M 430 130 Q 450 80 480 130" stroke="#e0e0e0" stroke-width="4" fill="none"/>
  <path d="M 480 120 Q 512 60 544 120" stroke="#e0e0e0" stroke-width="4" fill="none"/>
  <path d="M 544 130 Q 574 80 594 130" stroke="#e0e0e0" stroke-width="4" fill="none"/>
</svg>